[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "br-analysis"
version = "0.1.0"
description = "Reusable EEG analysis tools for binocular rivalry experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "mne>=1.10,<2",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3.1",
    "pyriemann>=0.11,<0.12",
    "scikit-learn>=1.8,<1.10",
    "scipy>=1.13,<1.18",
    "seaborn>=0.13,<0.14",
    "threadpoolctl>=3.5,<4",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
deep = [
    "braindecode @ git+https://github.com/braindecode/braindecode.git@f8c37d42eb29ca2ea351093d2ea34d6b29aa602d",
    "huggingface_hub>=0.29,<1",
    "safetensors>=0.5,<1",
    "timm>=1,<2",
    "torch>=2.3,<3",
]
explain = ["shap>=0.46,<1"]
cloud = ["kaggle>=2.2,<3"]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
br-analysis = "br_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["br_analysis*"]
namespaces = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["UP038"]

[tool.ruff.lint.per-file-ignores]
# Manim scenes rely on the library's star-import convention.
"animations/*.py" = ["F403", "F405"]
